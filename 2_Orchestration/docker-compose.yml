services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  api:
    build: ./api
    environment:
      REDIS_URL: redis://redis:6379/0
      SIMULATION_TICK_TOKEN: ${SIMULATION_TICK_TOKEN:-dev-tick-token}
      AUTO_TICK_SECONDS: ${AUTO_TICK_SECONDS:-60}
      CHECKIN_INTERVAL_SECONDS: ${CHECKIN_INTERVAL_SECONDS:-60}
    depends_on:
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  web:
    build: ./web
    environment:
      API_UPSTREAM: api:8000
    depends_on:
      - api
    ports:
      - "8080:80"
